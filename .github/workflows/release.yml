name: Release candidate (manual, signed provenance, no public release)

# Releases must not be published by pushing a tag before the P1/P3 host
# acceptance gates and operator sign-off are complete.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version (for example v0.2.0-rc.1)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  candidate:
    name: Validate, attest and package candidate
    # Manual RC builds may only attest reviewed main-branch source.
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Validate version format
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          [[ "$CANDIDATE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]] || {
            echo "Version must be vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N" >&2
            exit 1
          }
      - name: Verify module checksums and static analysis
        run: |
          go mod download
          go mod verify
          go vet ./...
      - name: Run full Go tests including race detector
        run: |
          go test -count=1 ./...
          go test -race -count=1 ./...
      - name: Scan reachable Go dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Package CLI release candidate
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            output="dist/anyflip-downloader_${CANDIDATE_VERSION}_${os}_${arch}"
            if [[ "$os" == windows ]]; then output="${output}.exe"; fi
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "$output" .
          done
          ( cd dist && sha256sum anyflip-downloader_* > SHA256SUMS )
          cp docs/RELEASE_CHECKLIST.md dist/
          cp CHANGELOG.md dist/
      - name: Attest the four built CLI binaries (no public Release or registry push)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/anyflip-downloader_*
      - name: Verify exact candidate checksums and source-bound attestations
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/anyflip-downloader_*)
          [[ "${#files[@]}" -eq 4 ]] || { echo "Expected four release components" >&2; exit 1; }
          ( cd dist && sha256sum -c SHA256SUMS )
          for binary in "${files[@]}"; do
            gh attestation verify "$binary" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref refs/heads/main \
              --source-digest "$GITHUB_SHA" >/dev/null
          done
      # Manual-only. Sign exact Docker archive BYTES, not an image label or
      # a host-local tag. No GHCR package write, public Release or deployment.
      - name: Assemble source-bound Staging image archive
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          context="$(mktemp -d)"
          trap 'rm -rf -- "$context"' EXIT
          install -m 0555 "dist/anyflip-downloader_${CANDIDATE_VERSION}_linux_amd64" "$context/anyflip-downloader"
          image="rcat-anyflip-staging:sha-${GITHUB_SHA}"
          docker build --platform linux/amd64 \
            -f deploy/staging/Dockerfile.signed-web \
            --build-arg "SOURCE_COMMIT=${GITHUB_SHA}" \
            -t "$image" "$context"
          mkdir -p dist/staging
          archive="dist/staging/anyflip-web_${CANDIDATE_VERSION}_linux_amd64.docker.tar"
          docker image save --output "$archive" "$image"
          ( cd dist/staging && sha256sum "${archive##*/}" > "${archive##*/}.sha256" )
          actual_id="$(docker image inspect --format '{{.Id}}' "$image")"
          actual_source="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
          [[ "$actual_id" =~ ^sha256:[0-9a-f]{64}$ && "$actual_source" == "$GITHUB_SHA" ]]
          printf '%s\n' "$actual_id" > "$archive.image-id"
          printf '%s\n' "$GITHUB_SHA" > "$archive.source-sha"
      - name: Attest the immutable Staging Docker image archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/staging/*.docker.tar
      - name: Verify Staging image archive bytes and source provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archives=(dist/staging/*.docker.tar)
          [[ "${#archives[@]}" -eq 1 && -f "${archives[0]}" ]] || exit 1
          ( cd dist/staging && sha256sum -c *.docker.tar.sha256 )
          gh attestation verify "${archives[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA" >/dev/null
      - name: Upload unapproved candidate assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anyflip-candidate-${{ inputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
