name: SUI Svelte integration

on:
  pull_request:
    paths:
      - "frontend/**"
      - "web_svelte.go"
      - "web_svelte_test.go"
      - "web.go"
      - "web/svelte/**"
      - "Dockerfile.svelte"
      - "scripts/build-svelte-embed.sh"
      - ".github/workflows/sui-svelte-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install lockfile-pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Svelte diagnostics
        run: npm run check
      - name: Build isolated preview
        run: npm run build
      - name: Install Chromium for focused visual checks
        run: npx playwright install --with-deps chromium
      - name: Responsive, user and Admin contract checks
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --port 4173 > "$RUNNER_TEMP/sui-preview.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat "$RUNNER_TEMP/sui-preview.log"; exit 1; fi
          npm run test:visual
          npm run test:journeys
          npm run test:admin
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Compile exact Go-embedded Svelte candidate and exercise strict CSP
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          (cd frontend && SUI_EMBED_BUILD=1 npm run build)
          mkdir -p web/svelte
          cp -R frontend/dist/. web/svelte/
          go test -run '^TestWebSvelteFrontend' -count=1 ./...
          go build -trimpath -o "$RUNNER_TEMP/sui04-web" .
          job1="$(mktemp -d "$RUNNER_TEMP/sui04-token-XXXXXXXX")"
          job2="$(mktemp -d "$RUNNER_TEMP/sui04-google-XXXXXXXX")"
          pid1=""
          pid2=""
          cleanup() {
            if [[ -n "$pid1" ]]; then kill "$pid1" 2>/dev/null || true; wait "$pid1" 2>/dev/null || true; fi
            if [[ -n "$pid2" ]]; then kill "$pid2" 2>/dev/null || true; wait "$pid2" 2>/dev/null || true; fi
            rm -rf -- "$job1" "$job2"
          }
          trap cleanup EXIT
          ANYFLIP_WEB_UI=svelte ANYFLIP_WEB_TOKEN=ci-sui04-synthetic-long-token ANYFLIP_JOB_DIR="$job1" \
            "$RUNNER_TEMP/sui04-web" -web -listen 127.0.0.1:8095 > "$RUNNER_TEMP/sui04-token.log" 2>&1 &
          pid1=$!
          ANYFLIP_WEB_UI=svelte ANYFLIP_AUTH_MODE=google \
            GOOGLE_CLIENT_ID=ci-synthetic-client GOOGLE_CLIENT_SECRET=ci-synthetic-secret \
            GOOGLE_REDIRECT_URI=http://127.0.0.1:8096/auth/google/callback ANYFLIP_JOB_DIR="$job2" \
            "$RUNNER_TEMP/sui04-web" -web -listen 127.0.0.1:8096 > "$RUNNER_TEMP/sui04-google.log" 2>&1 &
          pid2=$!
          for port in 8095 8096; do
            ready=0
            for attempt in {1..30}; do
              if curl --silent --fail "http://127.0.0.1:$port/healthz" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [[ "$ready" != "1" ]]; then
              cat "$RUNNER_TEMP/sui04-token.log" "$RUNNER_TEMP/sui04-google.log"
              exit 1
            fi
          done
          cd frontend
          SUI_GO_BASE_URL=http://127.0.0.1:8095 SUI_GO_GOOGLE_URL=http://127.0.0.1:8096 npm run test:go-embed
      - name: Verify production Svelte runtime overlay on a disposable CI container
        working-directory: .
        timeout-minutes: 12
        shell: bash
        env:
          ANYFLIP_AUTH_MODE: google
          ANYFLIP_RBAC_ENABLED: "0"
          GOOGLE_CLIENT_ID: ci-synthetic-client
          GOOGLE_CLIENT_SECRET: ci-synthetic-secret
          GOOGLE_REDIRECT_URI: https://anyflip.rcat.ac.th/auth/google/callback
        run: |
          set -euo pipefail
          bash -n scripts/deploy-svelte-ui.sh
          sh -n scripts/verify-svelte-ui.sh
          export SUI_SOURCE_DIR="$GITHUB_WORKSPACE" SUI_SOURCE_SHA="$GITHUB_SHA"
          project="sui05-ci-${GITHUB_RUN_ID}"
          compose=(docker compose -p "$project" -f compose.web.yaml -f compose.svelte.yaml)
          # The volume is CI-only, never a Host operator volume.
          cleanup() { "${compose[@]}" logs --tail=50 anyflip-web || true; "${compose[@]}" down -v --remove-orphans || true; }
          trap cleanup EXIT
          "${compose[@]}" config --format json | python3 -c '
          import json,sys,os
          service=json.load(sys.stdin)["services"]["anyflip-web"]
          assert service["environment"]["ANYFLIP_WEB_UI"]=="svelte"
          assert service["build"]["dockerfile"]=="Dockerfile.svelte"
          assert service["build"]["args"]["SOURCE_COMMIT"]==os.environ["GITHUB_SHA"]
          print("SUI05_COMPOSE_SOURCE_AND_MODE=PASS")
          '
          "${compose[@]}" up -d --build --no-deps anyflip-web
          ready=0
          for attempt in {1..45}; do
            if curl --silent --fail http://127.0.0.1:8094/healthz >/dev/null; then ready=1; break; fi
            sleep 2
          done
          if [[ "$ready" != 1 ]]; then echo "SUI05_CI_HEALTH_FAILED" >&2; exit 1; fi
          BASE_URL=http://127.0.0.1:8094 CANONICAL_HOST=anyflip.rcat.ac.th sh scripts/verify-svelte-ui.sh
          container="$("${compose[@]}" ps -q anyflip-web)"
          image="$(docker inspect --format '{{.Image}}' "$container")"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
          [[ "$revision" == "$GITHUB_SHA" ]] || { echo "SUI05_CI_REVISION_MISMATCH" >&2; exit 1; }
          echo "SUI05_SOURCE_PINNED_CONTAINER=PASS"
      - name: Preserve synthetic SUI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sui-preview-and-go-embed
          path: frontend/test-artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7
