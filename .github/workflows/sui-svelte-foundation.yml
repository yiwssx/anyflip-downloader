name: SUI Svelte foundation

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/sui-svelte-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install lockfile-pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Svelte diagnostics
        run: npm run check
      - name: Build isolated preview
        run: npm run build
      - name: Install Chromium for focused visual checks
        run: npx playwright install --with-deps chromium
      - name: Responsive and accessibility preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --port 4173 > "$RUNNER_TEMP/sui-preview.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:4173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then cat "$RUNNER_TEMP/sui-preview.log"; exit 1; fi
          npm run test:visual
          npm run test:journeys
      - name: Preserve synthetic SUI screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sui01-preview-chromium
          path: frontend/test-artifacts/screenshots/
          if-no-files-found: ignore
          retention-days: 7
