name: Browser E2E (changed Web surfaces)

on:
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'web.go'
      - 'web_google*.go'
      - 'main.go'
      - 'web_csp_test.go'
      - 'tests/browser-e2e.mjs'
      - 'tests/google-e2e.mjs'
      - '.github/workflows/browser-e2e.yml'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'web.go'
      - 'web_google*.go'
      - 'main.go'
      - 'web_csp_test.go'
      - 'tests/browser-e2e.mjs'
      - 'tests/google-e2e.mjs'
      - '.github/workflows/browser-e2e.yml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.engine }} desktop/mobile E2E
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANYFLIP_WEB_TOKEN: ci-browser-token-for-synthetic-tests-only
      BROWSER_TEST_BASE_URL: http://127.0.0.1:8094
      BROWSER_TEST_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install pinned Playwright browser (${{ matrix.engine }})
        run: |
          # Playwright WebKit 27.2 (1.64.x) falsely reports style-src-attr
          # violations for built-in <select> UA styles with strict CSP.
          # Pin WebKit to 1.63.0 until upstream WebKit issue 327212 is fixed.
          # https://github.com/microsoft/playwright/issues/43497
          version=1.64.1
          if [ "${{ matrix.engine }}" = "webkit" ]; then version=1.63.0; fi
          npm install --no-save --ignore-scripts "playwright@$version"
          npx playwright install --with-deps ${{ matrix.engine }}

      - name: Compile and run local isolated Web GUI for browser checks
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o "$RUNNER_TEMP/anyflip-browser-e2e" .
          export ANYFLIP_JOB_DIR
          ANYFLIP_JOB_DIR="$(mktemp -d "$RUNNER_TEMP/anyflip-browser-XXXXXXXX")"
          "$RUNNER_TEMP/anyflip-browser-e2e" -web -listen 127.0.0.1:8094 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            rm -rf -- "$ANYFLIP_JOB_DIR"
          }
          trap cleanup EXIT
          healthy=0
          for i in {1..30}; do
            if curl --silent --fail --max-time 2 "$BROWSER_TEST_BASE_URL/healthz" >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != 1 ]]; then
            echo 'Local Web GUI did not start' >&2
            exit 1
          fi
          node --check tests/browser-e2e.mjs
          node --test tests/browser-e2e.mjs
          # Verify Google-only sign-in UI without contacting live Google.
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          rm -rf -- "$ANYFLIP_JOB_DIR"
          ANYFLIP_JOB_DIR="$(mktemp -d "$RUNNER_TEMP/anyflip-google-XXXXXXXX")"
          export ANYFLIP_AUTH_MODE=google
          export GOOGLE_CLIENT_ID=ci-synthetic-client
          export GOOGLE_CLIENT_SECRET=ci-synthetic-secret
          export GOOGLE_REDIRECT_URI=http://127.0.0.1:8094/auth/google/callback
          "$RUNNER_TEMP/anyflip-browser-e2e" -web -listen 127.0.0.1:8094 &
          server_pid=$!
          healthy=0
          for i in {1..30}; do
            if curl --silent --fail --max-time 2 "$BROWSER_TEST_BASE_URL/healthz" >/dev/null; then
              healthy=1
              break
            fi
            sleep 1
          done
          if [[ "$healthy" != 1 ]]; then
            echo 'Google sign-in GUI did not start' >&2
            exit 1
          fi
          node --check tests/google-e2e.mjs
          node --test tests/google-e2e.mjs
