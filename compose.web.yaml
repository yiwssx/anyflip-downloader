# Example only: preserve the running host's quota overlay and 10.10.1.100:8094 LAN bind.
# Real public HTTPS ingress is provided by the independent Cloudflare Tunnel.
services:
  anyflip-web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["-web", "-listen", "0.0.0.0:8080"]
    environment:
      # Optional in Google Workspace mode. Required and length-validated in token mode.
      ANYFLIP_WEB_TOKEN: ${ANYFLIP_WEB_TOKEN:-}
      # Default 'token' preserves the running deployment until an approved login cutover.
      ANYFLIP_AUTH_MODE: ${ANYFLIP_AUTH_MODE:-token}
      # Explicit opt-in; RBAC role store must already have been bootstrapped.
      ANYFLIP_RBAC_ENABLED: ${ANYFLIP_RBAC_ENABLED:-0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ANYFLIP_JOB_DIR: /data/jobs
      # Allow pdfcpu to initialize its config without writing to read-only root.
      HOME: /data/jobs
      XDG_CONFIG_HOME: /data/jobs/.config
    ports:
      # Defaults to loopback in CI/dev; on the existing Ubuntu host explicitly set
      # ANYFLIP_HOST_BIND_IP=10.10.1.100 to PRESERVE the live LAN binding.
      - "${ANYFLIP_HOST_BIND_IP:-127.0.0.1}:8094:8080"
    volumes:
      - anyflip_jobs:/data/jobs
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: "2.0"
    # Allow the Go service to cancel jobs and drain requests on SIGTERM.
    stop_grace_period: 35s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  anyflip_jobs:
